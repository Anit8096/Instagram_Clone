name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Ktor) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Integration tests start Postgres with Testcontainers; the hosted runner has Docker.
      - run: chmod +x gradlew && ./gradlew test --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-reports
          path: server/build/reports/tests

  android:
    name: Android lint, unit tests, debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # No google-services.json in CI: the build skips the google-services plugin and FCM stays inert.
      - run: chmod +x gradlew && ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest
