services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: insta
      POSTGRES_USER: ${DATABASE_USER:-insta}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d insta"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Job queue transport (Streams), rate limits and cache. AOF so queued stream entries survive a restart; Postgres
  # stays the source of truth for jobs either way.
  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    depends_on:
      postgres:
        condition: service_healthy
      # Started first so the server connects right away; it still starts (degraded) if Redis is down later.
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/insta
      REDIS_URL: redis://redis:6379
      DATABASE_USER: ${DATABASE_USER:-insta}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      OTP_DEV_ECHO: ${OTP_DEV_ECHO:-false}
      MEDIA_ROOT: /data/media
      # Path inside the container, e.g. /run/secrets/insta/firebase-adminsdk.json. Empty = push disabled.
      FIREBASE_CREDENTIALS_FILE: ${FIREBASE_CREDENTIALS_FILE:-}
    ports:
      - "8080:8080"
    volumes:
      - media:/data/media
      # ./secrets is gitignored; put the Firebase service-account JSON here.
      - ./secrets:/run/secrets/insta:ro

volumes:
  pgdata:
  redisdata:
  media:
