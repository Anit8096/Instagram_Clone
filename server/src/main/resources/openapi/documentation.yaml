openapi: 3.0.3
info:
  title: Insta API
  version: 0.1.0
  description: |
    Backend for the Insta Android app. All endpoints live under `/api/v1`.
    Errors always use the `ErrorEnvelope` shape. Authenticated endpoints need
    `Authorization: Bearer <accessToken>`; refresh it with `POST /auth/refresh`.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Liveness + database check
      responses:
        '200': { description: Healthy }
        '503': { description: Database unreachable }

  /api/v1/auth/google:
    post:
      tags: [auth]
      summary: Sign in with a Google ID token (the only way to create an account)
      description: |
        A linked Google account signs in (`type: signed_in`). A new Google user gets `type: needs_onboarding` with a
        15-minute onboarding token: verify a phone (`/auth/onboarding/otp`) and pick a username
        (`/auth/onboarding/complete`) to create the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
      responses:
        '200':
          description: Signed in, or onboarding required
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      type: { type: string, enum: [signed_in] }
                      auth: { $ref: '#/components/schemas/AuthResponse' }
                  - type: object
                    properties:
                      type: { type: string, enum: [needs_onboarding] }
                      onboardingToken: { type: string }
                      suggestedUsername: { type: string }
                      displayName: { type: string }
                      email: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Error' }
        '501': { description: Google sign-in not configured on this server }

  /api/v1/auth/phone/otp:
    post:
      tags: [auth]
      summary: Send a sign-in code to a phone linked to an account
      description: Unknown numbers get 404 `NO_LINKED_ACCOUNT`; phone sign-in never creates accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneOtpRequest' }
      responses:
        '200': { $ref: '#/components/responses/OtpChallenge' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/phone/verify:
    post:
      tags: [auth]
      summary: Sign in with the code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
      responses:
        '200': { $ref: '#/components/responses/Auth' }
        '400': { description: 'OTP_INVALID (with attemptsLeft), OTP_EXPIRED, OTP_USED or OTP_TOO_MANY_ATTEMPTS' }

  /api/v1/auth/onboarding/otp:
    post:
      tags: [auth]
      summary: New Google user, step 1 — send a code to the phone they want to link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [onboardingToken, phone]
              properties:
                onboardingToken: { type: string }
                phone: { type: string, example: '+919876543210' }
      responses:
        '200': { $ref: '#/components/responses/OtpChallenge' }
        '401': { description: INVALID_ONBOARDING_TOKEN }
        '409': { description: PHONE_IN_USE }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/onboarding/complete:
    post:
      tags: [auth]
      summary: New Google user, step 2 — verify the code and create the account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [onboardingToken, challengeId, code, username]
              properties:
                onboardingToken: { type: string }
                challengeId: { type: string, format: uuid }
                code: { type: string, example: '123456' }
                username: { type: string, pattern: '^[a-z0-9._]{3,30}$' }
                displayName: { type: string, maxLength: 60 }
      responses:
        '201': { $ref: '#/components/responses/Auth' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { description: INVALID_ONBOARDING_TOKEN }
        '409': { description: USERNAME_TAKEN or PHONE_IN_USE }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token
      description: |
        Each refresh token is single-use. Presenting one that was already used revokes
        every token from the same login (theft detection) and returns 401.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { $ref: '#/components/responses/Auth' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the refresh token's session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Logged out (also returned for unknown tokens) }

  /api/v1/me:
    get:
      tags: [users]
      summary: The signed-in user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user, including private fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }

    patch:
      tags: [users]
      summary: Update display name, bio or avatar (omitted fields unchanged)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, maxLength: 60 }
                bio: { type: string, maxLength: 150 }
                avatarMediaId: { type: string, format: uuid, description: Media uploaded with kind=avatar }
                removeAvatar: { type: boolean }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

    delete:
      tags: [users]
      summary: Permanently delete the account (re-authentication required)
      description: >
        Cascades posts, media (files removed after commit), comments, likes, follows, conversations, notifications,
        device and refresh tokens. Confirm with a code from `POST /me/delete/otp` (`challengeId` + `code`) or a fresh
        `googleIdToken` for the account's own Google identity.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challengeId: { type: string, format: uuid }
                code: { type: string }
                googleIdToken: { type: string }
      responses:
        '204': { description: Deleted }
        '400': { description: 'OTP_INVALID, OTP_EXPIRED, OTP_USED or OTP_TOO_MANY_ATTEMPTS' }
        '403': { description: REAUTH_FAILED (no or wrong confirmation) }

  /api/v1/me/delete/otp:
    post:
      tags: [users]
      summary: Send a delete-account confirmation code to the account's phone
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OtpChallenge' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me/phone/otp:
    post:
      tags: [users]
      summary: Change phone, step 1 — send a code to the new number
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneOtpRequest' }
      responses:
        '200': { $ref: '#/components/responses/OtpChallenge' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { description: PHONE_IN_USE }

  /api/v1/me/phone:
    put:
      tags: [users]
      summary: Change phone, step 2 — verify the code; the new number replaces the old one
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { description: 'OTP_* errors' }
        '409': { description: PHONE_IN_USE }

  /api/v1/media:
    post:
      tags: [media]
      summary: Upload an image (JPEG/PNG/WebP, max 10 MB)
      description: Re-encoded to JPEG without metadata; display size fits 1080x1350, thumbnail is 320x320.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [post, avatar], default: post } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Stored media
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/media/{id}/{variant}:
    get:
      tags: [media]
      summary: Image bytes (public, immutable, ETag)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: variant, in: path, required: true, schema: { type: string, enum: [full, thumb] } }
      responses:
        '200': { description: JPEG image, content: { image/jpeg: {} } }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/posts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: Client-generated id }
    put:
      tags: [posts]
      summary: Create a post (idempotent per client id)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaId]
              properties:
                mediaId: { type: string, format: uuid }
                caption: { type: string, maxLength: 2200 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } } }
        '200': { description: Already existed (retry), content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    get:
      tags: [posts]
      summary: A post
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Post, content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } } }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [posts]
      summary: Delete your own post (and its image)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/users/{username}:
    get:
      tags: [users]
      summary: Public profile with counts
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  postCount: { type: integer }
                  followerCount: { type: integer }
                  followingCount: { type: integer }
                  isMe: { type: boolean }
                  isFollowing: { type: boolean }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/users/{username}/posts:
    get:
      tags: [users]
      summary: A user's posts, newest first (cursor pagination)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 30, maximum: 60 } }
      responses:
        '200':
          description: Page of posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Post' } }
                  nextCursor: { type: string, nullable: true }

  /api/v1/notifications:
    get:
      tags: [notifications]
      summary: Activity (likes, comments, follows), newest first (cursor pagination)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 30, maximum: 60 } }
      responses:
        '200':
          description: Page of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  nextCursor: { type: string, nullable: true }

  /api/v1/notifications/unread-count:
    get:
      tags: [notifications]
      summary: Unread activity count (badge)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Count
          content:
            application/json:
              schema: { type: object, properties: { count: { type: integer } } }

  /api/v1/notifications/read:
    post:
      tags: [notifications]
      summary: Mark all activity read; other sessions receive a `badge` socket event
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Marked read }

  /api/v1/me/devices/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string, maxLength: 512 } }
    put:
      tags: [notifications]
      summary: Register this install's FCM token (moves it if another account had it)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Registered }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      tags: [notifications]
      summary: Unregister the token (on logout)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Removed }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Auth:
      description: Tokens + user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthResponse' }
    OtpChallenge:
      description: Code sent (5-minute expiry, 30 s resend cooldown, 5 per number per hour)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OtpChallenge' }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    PhoneOtpRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, description: 'E.164, e.g. +919876543210', example: '+919876543210' }
    VerifyOtpRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, example: '123456' }
    OtpChallenge:
      type: object
      properties:
        challengeId: { type: string, format: uuid }
        sentTo: { type: string, example: '+91 ••••••3210' }
        expiresIn: { type: integer, description: Seconds (300) }
        resendIn: { type: integer, description: Seconds until another code may be requested (30) }
        devCode: { type: string, nullable: true, description: Only when the server runs with OTP_DEV_ECHO=true }
    Me:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            phone: { type: string, description: Private; only in the account owner's own data }
            email: { type: string, nullable: true, description: The Google account's email }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, description: Access token lifetime in seconds }
        user: { $ref: '#/components/schemas/Me' }
        isNewUser: { type: boolean }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        bio: { type: string }
        avatarUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Media:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        thumbUrl: { type: string }
        width: { type: integer }
        height: { type: integer }
    Post:
      type: object
      properties:
        id: { type: string, format: uuid }
        author:
          type: object
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            displayName: { type: string }
            avatarUrl: { type: string, nullable: true }
        imageUrl: { type: string }
        thumbUrl: { type: string }
        width: { type: integer }
        height: { type: integer }
        caption: { type: string }
        likeCount: { type: integer }
        commentCount: { type: integer }
        likedByMe: { type: boolean }
        createdAt: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [like, comment, follow] }
        actor:
          type: object
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            displayName: { type: string }
            avatarUrl: { type: string, nullable: true }
        postId: { type: string, nullable: true }
        postThumbUrl: { type: string, nullable: true }
        commentId: { type: string, nullable: true }
        commentBody: { type: string, nullable: true }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details:
              type: object
              additionalProperties: { type: string }
